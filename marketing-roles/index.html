<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OneLaser 市场部岗位职责清单</title>
<style>
:root{--ink:#14213d;--ink2:#4a5568;--line:#e6e9f0;--bg:#f5f6fb;--card:#fff;--good:#16a34a;--warn:#d97706;--bad:#dc2626}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px 60px}
header{background:linear-gradient(120deg,#0b1026 0%,#26338f 50%,#7c3aed 85%,#ff5a1f 130%);color:#fff;padding:30px 0 86px;position:relative;overflow:hidden}
header:after{content:"";position:absolute;right:-140px;top:-160px;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,rgba(255,90,31,.5),transparent 65%)}
.top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.tag{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:4px 12px;border-radius:999px;font-size:13px}
.lang{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:#fff;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13px}
.lang button.on{background:#fff;color:var(--ink)}
h1{font-size:32px;margin:18px 0 8px;position:relative;z-index:1}
h1 em{font-style:normal;background:linear-gradient(90deg,#ffd166,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{max-width:880px;margin:0;opacity:.92;position:relative;z-index:1}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:-58px;position:relative;z-index:2}
.kpi{background:#fff;border-radius:16px;padding:16px 18px;box-shadow:0 8px 24px rgba(20,33,61,.08);border-top:4px solid var(--c)}
.kpi .v{font-size:27px;font-weight:800;color:var(--c)}
.kpi .l{font-size:13px;color:var(--ink2)}
section{margin-top:34px}
h2{font-size:22px;margin:0 0 6px;display:flex;align-items:center;gap:10px}
h2 .dot{width:10px;height:26px;border-radius:4px;background:var(--c)}
.sub{color:var(--ink2);margin:0 0 16px;font-size:14px}
.org{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ot{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 4px 14px rgba(20,33,61,.06);border-left:6px solid var(--c);cursor:pointer;transition:transform .15s}
.ot:hover{transform:translateY(-2px)}
.ot .n{font-weight:800;font-size:15.5px;color:var(--c)}
.ot .m{font-size:13px;color:var(--ink2);margin:4px 0 8px}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.st{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px}
.st.filled{background:#e8f7ee;color:var(--good)}
.st.partial{background:#fff6e5;color:var(--warn)}
.st.vacant{background:#fdecec;color:var(--bad)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer;color:var(--ink2);font-weight:600}
.filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.role{background:#fff;border-radius:20px;box-shadow:0 6px 20px rgba(20,33,61,.06);margin-bottom:18px;overflow:hidden;scroll-margin-top:16px}
.rh{padding:16px 20px;color:#fff;background:linear-gradient(120deg,var(--c),var(--c2));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.rh .t{font-size:19px;font-weight:800}
.rh .mi{font-size:13.5px;opacity:.95;margin-top:2px;max-width:760px}
.rh .ow{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:12px;padding:6px 12px;font-size:13px;text-align:right}
.rh .ow b{display:block;font-size:14.5px}
.rb{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.col{padding:16px 20px;border-right:1px solid var(--line)}
.col:last-child{border-right:0}
.col h4{margin:0 0 8px;font-size:13px;letter-spacing:.5px;display:flex;align-items:center;gap:8px;color:var(--c)}
.col h4 span{background:var(--cb);color:var(--c);border-radius:6px;padding:2px 8px}
.col ul{margin:0;padding-left:18px;font-size:13.5px}
.col li{margin:4px 0}
.rf{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:0;border-top:1px solid var(--line);background:#fafbfe}
.rf>div{padding:12px 20px;font-size:13px;border-right:1px solid var(--line)}
.rf>div:last-child{border-right:0}
.rf .lb{font-size:11.5px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.6px;display:block;margin-bottom:5px}
.kp{display:inline-block;background:var(--cb);color:var(--c);font-weight:700;border-radius:8px;padding:3px 8px;margin:2px 4px 2px 0;font-size:12.5px}
.card{background:#fff;border-radius:18px;box-shadow:0 6px 20px rgba(20,33,61,.06);padding:6px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:12px;color:var(--ink2);padding:12px 8px;border-bottom:2px solid var(--line);font-weight:700;white-space:nowrap}
th.rc{writing-mode:horizontal-tb}
td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:center}
td:first-child,th:first-child{text-align:left;white-space:nowrap}
.r,.a,.c{display:inline-flex;width:26px;height:26px;border-radius:50%;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.r{background:#2563eb;color:#fff}.a{background:#ff5a1f;color:#fff}.c{background:#e9edf5;color:#64748b}
.rk{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin:0 0 12px}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.rule{background:#fff;border-radius:16px;padding:16px;border-top:5px solid var(--c);box-shadow:0 4px 14px rgba(20,33,61,.05)}
.rule h3{margin:0 0 6px;font-size:15px;color:var(--c)}
.rule p{margin:0;font-size:13.5px;color:var(--ink2)}
.budget{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.bd{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 14px rgba(20,33,61,.05)}
.bd .p{font-size:26px;font-weight:800;color:var(--c)}
.bd .bar{height:10px;border-radius:99px;background:#eef0f4;margin:8px 0;overflow:hidden}
.bd .bar i{display:block;height:100%;background:var(--c)}
.bd small{color:var(--ink2);font-size:13px}
footer{margin-top:28px;color:#9aa3b2;font-size:12.5px}
@media(max-width:980px){.org,.rules,.budget{grid-template-columns:1fr 1fr}.rb,.rf{grid-template-columns:1fr}.col,.rf>div{border-right:0;border-bottom:1px solid var(--line)}.kpis{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.org,.rules,.budget{grid-template-columns:1fr}h1{font-size:25px}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top"><span class="tag" data-t="tag"></span><div class="lang"><button id="bz">中文</button><button id="be">EN</button></div></div>
  <h1 data-t="h1"></h1><p class="lead" data-t="lead"></p>
</div></header>
<div class="wrap">
  <div class="kpis" id="kpis"></div>

  <section><h2 style="--c:#7c3aed"><span class="dot"></span><span data-t="s_org"></span></h2>
    <p class="sub" data-t="s_org_sub"></p><div class="org" id="org"></div></section>

  <section><h2 style="--c:#2563eb"><span class="dot"></span><span data-t="s_roles"></span></h2>
    <p class="sub" data-t="s_roles_sub"></p><div class="filters" id="filters"></div><div id="roles"></div></section>

  <section><h2 style="--c:#ff5a1f"><span class="dot"></span><span data-t="s_raci"></span></h2>
    <p class="sub" data-t="s_raci_sub"></p><div class="rk" id="rk"></div><div class="card"><table id="raci"></table></div></section>

  <section><h2 style="--c:#16a34a"><span class="dot"></span><span data-t="s_bud"></span></h2>
    <p class="sub" data-t="s_bud_sub"></p><div class="budget" id="budget"></div></section>

  <section><h2 style="--c:#0f766e"><span class="dot"></span><span data-t="s_rules"></span></h2>
    <p class="sub" data-t="s_rules_sub"></p><div class="rules" id="rules"></div></section>

  <footer data-t="foot"></footer>
</div>

 filters.innerHTML=[['all',t.all],['filled',t.stl.filled],['partial',t.stl.partial],['vacant',t.stl.vacant]].map(f=>`<button class="${F===f[0]?'on':''}" onclick="setF('${f[0]}')">${f[1]}</button>`).join('');

 roles.innerHTML=ROLES.filter(r=>F==='all'||r.st===F).map(r=>{const x=r[L];return `<div class="role" id="r-${r.id}" style="--c:${r.c};--c2:${r.c2};--cb:${r.cb}"><div class="rh"><div><div class="t">${x.n}</div><div class="mi">${x.m}</div></div><div class="ow">${t.owner} · ${t.stl[r.st]}<b>${x.o}</b></div></div><div class="rb"><div class="col"><h4><span>${t.day}</span></h4>${li(x.d)}</div><div class="col"><h4><span>${t.week}</span></h4>${li(x.w)}</div><div class="col"><h4><span>${t.month}</span></h4>${li(x.mo)}</div></div><div class="rf"><div><span class="lb">${t.kl}</span>${x.k.map(k=>`<span class="kp">${k}</span>`).join('')}</div><div><span class="lb">${t.tll}</span>${x.tl}</div><div><span class="lb">${t.wil}</span>${x.wi}</div></div></div>`}).join('');
