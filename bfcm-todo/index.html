<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OneLaser BFCM 2026 市场部待办清单</title>
<style>
:root{--ink:#14213d;--ink2:#4a5568;--line:#e6e9f0;--bg:#f4f5fb}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px 60px}
header{background:#05060f;color:#fff;padding:28px 0 92px;position:relative;overflow:hidden}
header:before{content:"";position:absolute;inset:0;background:radial-gradient(600px 300px at 85% 0%,rgba(255,90,31,.55),transparent 70%),radial-gradient(500px 280px at 5% 100%,rgba(37,99,235,.45),transparent 70%)}
.top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1;gap:10px;flex-wrap:wrap}
.tag{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);padding:4px 12px;border-radius:999px;font-size:13px}
.lang{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:#fff;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13px}
.lang button.on{background:#fff;color:var(--ink)}
h1{font-size:34px;margin:18px 0 8px;position:relative;z-index:1;font-weight:900}
h1 em{font-style:normal;background:linear-gradient(90deg,#ffd166,#ff5a1f);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{max-width:900px;margin:0;opacity:.9;position:relative;z-index:1;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:-60px;position:relative;z-index:2}
.kpi{background:#fff;border-radius:16px;padding:15px 17px;box-shadow:0 10px 26px rgba(20,33,61,.1);border-top:4px solid var(--c)}
.kpi .v{font-size:27px;font-weight:900;color:var(--c)}
.kpi .l{font-size:12.5px;color:var(--ink2)}
.bar{height:8px;background:#eef0f4;border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--c);transition:width .3s}
.note{background:#fff7ed;border:2px solid #fed7aa;border-radius:14px;padding:11px 14px;font-size:13px;color:#7c2d12;margin:24px 0 18px}
.people{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.pc{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 6px 18px rgba(20,33,61,.07)}
.pc.wide{grid-column:1/-1}
.ph{padding:16px 20px;color:#fff;background:linear-gradient(120deg,var(--c),var(--c2));display:flex;justify-content:space-between;align-items:center;gap:12px}
.ph .n{font-size:20px;font-weight:900}
.ph .r{font-size:13px;opacity:.95}
.ph .pg{text-align:right;font-size:12.5px;min-width:110px}
.ph .pg b{font-size:20px;display:block}
.ph .bar{background:rgba(255,255,255,.3)}.ph .bar i{background:#fff}
.kp{padding:14px 20px;background:var(--cb);display:grid;gap:8px}
.kp .lb{font-size:11.5px;font-weight:800;color:var(--c);letter-spacing:.8px}
.kk{display:flex;gap:10px;align-items:baseline;background:#fff;border-radius:12px;padding:10px 12px;border-left:5px solid var(--c)}
.kk b{font-size:18px;color:var(--c);white-space:nowrap}
.kk span{font-size:13.5px;color:var(--ink2)}
.blocks{display:grid;grid-template-columns:1fr;gap:0}
.pc.wide .blocks{grid-template-columns:repeat(4,1fr)}
.blk{padding:12px 20px 14px;border-top:1px solid var(--line)}
.pc.wide .blk{border-right:1px solid var(--line)}
.pc.wide .blk:last-child{border-right:0}
.blk h4{margin:0 0 6px;font-size:13px;color:var(--c);display:flex;align-items:center;gap:6px}
.blk h4:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.task{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:start;padding:7px 0;cursor:pointer}
.task input{width:18px;height:18px;margin-top:1px;accent-color:var(--c);cursor:pointer}
.task .t{font-size:14px}
.task.done .t{text-decoration:line-through;color:#9aa3b2}
.d{font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--db);color:var(--df);white-space:nowrap}
footer{margin-top:28px;color:#9aa3b2;font-size:12.5px}
@media(max-width:980px){.people{grid-template-columns:1fr}.pc.wide .blocks{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.pc.wide .blocks{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap">
 <div class="top"><span class="tag" data-t="tag"></span><div class="lang"><button id="bz">中文</button><button id="be">EN</button></div></div>
 <h1 data-t="h1"></h1><p class="lead" data-t="lead"></p>
</div></header>
<div class="wrap">
 <div class="kpis" id="kpis"></div>
 <div class="note" data-t="note"></div>
 <div class="people" id="out"></div>
 <footer data-t="foot"></footer>
</div>
<script>
// person: id, name, colors, role zh/en, KPIs [[value zh, desc zh, value en, desc en]], blocks [[name zh, name en, [[id, dateKey, zh, en]]]]
// dateKey: 0 = daily, 1 = trigger, else MMDD
const PEOPLE=[
{id:'kc',n:'KC',c:'#dc2626',c2:'#f97316',cb:'#fff1ee',wide:true,zh:'总负责 · KOL · CRM · 定价',en:'Owner · KOL · CRM · pricing',
 kpi:[['$50 万','两个月营收（11/10–12/31）','$500K','Two-month revenue (11/10–12/31)'],['192 台','清货型号全部卖完','192 units','Sell out every clearance unit']],
 b:[['总负责','Overall',[['k1',1106,'拍板主标语和分工','Decide headline and owners'],['k2',1108,'审批设计定稿','Approve final designs'],['k3',1207,'活动复盘会','Campaign post-mortem']]],
    ['定价','Pricing',[['k4',1109,'核对官网价格与价格表一致（含两档套装、Hydra 07 Pro 两段价）','Check site prices match the price sheet (bundles, Hydra 07 Pro two-stage)'],['k5',1,'Hydra 07 Pro 卖满 14 台：当天改价 $8,999','Hydra 07 Pro hits 14 sold: reprice to $8,999 that day']]],
    ['KOL','KOL',[['k6',1107,'通知所有 KOL，发素材和专属追踪链接','Notify all KOLs with assets and a unique tracking link'],['k7',1107,'停用所有 KOL 折扣码（11/10 起）','Turn off all KOL discount codes (from 11/10)']]],
    ['CRM','CRM',[['k8',1108,'确认 Meta / Google / 网站线索都进 Pipedrive','Confirm Meta / Google / site leads all reach Pipedrive'],['k9',0,'新线索当天分给 Murphy','Assign new leads to Murphy the same day']]]]},
{id:'marcus',n:'Marcus',c:'#2563eb',c2:'#06b6d4',cb:'#eaf4ff',zh:'付费广告 · 社媒',en:'Paid ads · social media',
 kpi:[['ROAS ≥ 8','广告回报，低于 3 的广告当天关','ROAS ≥ 8','Ad return; kill anything under 3 the same day'],['≤ 5%','广告费占营收（约 $25,000）','≤ 5%','Ad spend share of revenue (about $25,000)']],
 b:[['付费广告','Paid ads',[['m1',1109,'Google / Meta BFCM 广告搭好、素材上传','Build Google / Meta BFCM campaigns and upload creatives'],['m2',1110,'广告上线','Ads go live'],['m3',0,'看 ROAS，调预算','Check ROAS, adjust budget']]],
    ['社媒','Social media',[['m4',1109,'BFCM 社媒内容日历','BFCM social content calendar'],['m5',0,'按日历发帖，24 小时内回复评论','Post on schedule; answer comments within 24h']]]]},
{id:'trung',n:'Trung',c:'#be185d',c2:'#f472b6',cb:'#fdeef6',zh:'EDM · SEO',en:'Email · SEO',
 kpi:[['1.5%','订阅率（现在 0.7%）','1.5%','Signup rate (now 0.7%)'],['3 篇','SEO 文章 11/9 前上线','3 articles','SEO articles live by 11/9']],
 b:[['EDM','Email',[['t1',1106,'发早鸟名单招募邮件','Send the early-access signup email'],['t2',1109,'BFCM 邮件排程：上线 / 感恩节 / 黑五 / 网一 / 最后 24 小时','Schedule BFCM emails: launch / Thanksgiving / Black Friday / Cyber Monday / last 24h'],['t3',1109,'弃购流程换成 BFCM 版','Switch the abandoned-cart flow to BFCM']]],
    ['SEO','SEO',[['t4',1108,'文章 1：年度最大 BFCM 促销','Article 1: the biggest BFCM deals of the year'],['t5',1108,'文章 2：XRF 38W RF 最后机会 + Hydra 07 Pro 最强 RF','Article 2: XRF 38W RF last chance + Hydra 07 Pro best RF'],['t6',1109,'文章 3：Cobra 罕见 deal','Article 3: a rare Cobra deal']]]]},
{id:'design',n:'Alex Li · Elian',c:'#7c3aed',c2:'#a78bfa',cb:'#f3edff',zh:'设计 · 网站制作',en:'Design · website build',
 kpi:[['11/9','设计和营销页按时上线','11/9','Designs and landing page live on time'],['> 0.41%','营销页转化率高于现在的全站水平','> 0.41%','Landing page CVR above today\'s site rate']],
 b:[['设计','Design',[['d1',1107,'7 套广告图，每套 3 个方案','7 ad sets, 3 options each'],['d2',1108,'定稿并导出全部尺寸','Finalize and export all sizes'],['d3',1108,'提前做 Hydra 07 Pro $8,999 版','Prepare the Hydra 07 Pro $8,999 version']]],
    ['网站','Website',[['d4',1109,'营销页 /page/BFCM2026 + 库存条 + 倒计时，测试通过','Landing page /page/BFCM2026 + stock bars + countdown, QA passed'],['d5',1109,'首页 Banner 换 BFCM 版','Swap the homepage banner to BFCM'],['d6',0,'巡检价格库存，卖完下架','Check prices and stock; delist when sold out']]]]},
{id:'murphy',n:'Murphy',c:'#16a34a',c2:'#4ade80',cb:'#ecfbf1',zh:'销售',en:'Sales',
 kpi:[['$25 万','销售成交营收（目标的一半）','$250K','Sales-closed revenue (half the goal)'],['24 小时','新线索全部在 24 小时内跟进','24 hours','Follow up every new lead within 24h']],
 b:[['销售','Sales',[['s1',1110,'老线索和报价未成交客户：发 BFCM 邮件并电话跟进','Old leads and unclosed quotes: BFCM email + call'],['s2',0,'新线索 24 小时内跟进','Follow up new leads within 24h'],['s3',0,'XRF 主动推 $4,999 套装 B','Upsell XRF to the $4,999 Bundle B']]]]}];
const T={
zh:{tag:'OneLaser · 市场部 · BFCM 2026',h1:'BFCM 2026 <em>市场部待办清单</em>',
lead:'5 个人，每人 2 个 KPI，每个板块 2–3 件事。活动 11/10–11/30，两个月目标 $50 万。日期在 11/10 之前的，上线前必须做完。',
k:['负责人','全部任务','已完成','距离上线'],kd:'天',
note:'<b>说明：</b>勾选只保存在你自己的浏览器里。团队共享进度请在钉钉群或 craftos 里同步。',
kl:'KPI',daily:'每天',trig:'触发时',
foot:'OneLaser 市场部 · BFCM 2026。价格以《BFCM 价格策略与清货目标》为准。日期按太平洋时间。'},
en:{tag:'OneLaser · Marketing · BFCM 2026',h1:'BFCM 2026 <em>Marketing To-Do List</em>',
lead:'Five people, two KPIs each, 2–3 tasks per area. The campaign runs 11/10–11/30 with a $500K two-month goal. Anything dated before 11/10 must be done before launch.',
k:['Owners','All tasks','Done','Days to launch'],kd:'days',
note:'<b>Note:</b> ticks are saved only in your own browser. Share team progress in the DingTalk group or craftos.',
kl:'KPI',daily:'Daily',trig:'On trigger',
foot:'OneLaser Marketing · BFCM 2026. Prices follow the "BFCM Pricing Strategy & Clearance Goals" page. Dates in Pacific time.'}};
let L='zh',D={};
try{L=localStorage.getItem('todo-lang')||'zh';D=JSON.parse(localStorage.getItem('todo2-done')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('todo2-done',JSON.stringify(D));localStorage.setItem('todo-lang',L)}catch(e){}};
const ALL=PEOPLE.flatMap(p=>p.b.flatMap(b=>b[2].map(t=>t[0])));
const dl=k=>k===0?T[L].daily:k===1?T[L].trig:`${Math.floor(k/100)}/${k%100}`;
const dcol=k=>k<2?['#ede9fe','#6d28d9']:k<=1110?['#fdecec','#b91c1c']:k<=1130?['#fff1e6','#c2410c']:['#eef2ff','#4338ca'];
function render(){
 const t=T[L];document.documentElement.lang=L==='zh'?'zh':'en';
 document.querySelectorAll('[data-t]').forEach(e=>e.innerHTML=t[e.dataset.t]);
 bz.className=L==='zh'?'on':'';be.className=L==='en'?'on':'';
 const done=ALL.filter(id=>D[id]).length,days=Math.max(0,Math.ceil((new Date('2026-11-10T00:00:00-08:00')-new Date())/864e5));
 const kv=[[PEOPLE.length,'#14213d',null],[ALL.length,'#2563eb',null],[done,'#16a34a',done/ALL.length],[days+' '+t.kd,'#ff5a1f',null]];
 kpis.innerHTML=kv.map((k,i)=>`<div class="kpi" style="--c:${k[1]}"><div class="v">${k[0]}</div><div class="l">${t.k[i]}</div>${k[2]!==null?`<div class="bar"><i style="width:${k[2]*100}%"></i></div>`:''}</div>`).join('');
 out.innerHTML=PEOPLE.map(p=>{const ids=p.b.flatMap(b=>b[2].map(x=>x[0])),dn=ids.filter(id=>D[id]).length;
  return `<div class="pc ${p.wide?'wide':''}" style="--c:${p.c};--c2:${p.c2};--cb:${p.cb}"><div class="ph"><div><div class="n">${p.n}</div><div class="r">${p[L]}</div></div><div class="pg"><b>${dn}/${ids.length}</b><div class="bar"><i style="width:${dn/ids.length*100}%"></i></div></div></div>
  <div class="kp"><span class="lb">${t.kl}</span>${p.kpi.map(k=>`<div class="kk"><b>${L==='zh'?k[0]:k[2]}</b><span>${L==='zh'?k[1]:k[3]}</span></div>`).join('')}</div>
  <div class="blocks">${p.b.map(b=>`<div class="blk"><h4>${L==='zh'?b[0]:b[1]}</h4>${b[2].map(x=>{const[db,df]=dcol(x[1]),d=!!D[x[0]];return `<div class="task ${d?'done':''}" onclick="tg('${x[0]}',event)"><input type="checkbox" ${d?'checked':''} onclick="event.stopPropagation();tg('${x[0]}')"><div class="t">${L==='zh'?x[2]:x[3]}</div><span class="d" style="--db:${db};--df:${df}">${dl(x[1])}</span></div>`}).join('')}</div>`).join('')}</div></div>`}).join('');
 document.title=L==='zh'?'OneLaser BFCM 2026 市场部待办清单':'OneLaser BFCM 2026 Marketing To-Do List';
}
function tg(id,ev){if(ev&&ev.target.tagName==='INPUT')return;D[id]=!D[id];if(!D[id])delete D[id];save();render()}
bz.onclick=()=>{L='zh';save();render()};be.onclick=()=>{L='en';save();render()};
render();
</script>
</body>
</html>
