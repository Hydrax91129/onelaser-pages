ideas:[['01','早鸟名单（Early Access）','11/6–9 先开"黑五早鸟名单"，留邮箱/手机号的人提前 24 小时拿到 SUPER Deal。上线前就攒一批高意向客户，顺便把订阅率从 0.7% 拉起来。',5,2,'#ff5a1f'],
['02','真实库存条 + 已售跳动','营销页每款显示"已售 X / 剩 Y"，Hydra 07 Pro 显示"前 14 台还剩 N 台"。数字是真的，紧迫感也是真的——比假倒计时更有说服力，也没有合规风险。',5,2,'#dc2626'],
['03','翻出老线索','Pipedrive 里有大量未跟进线索和报过价没成交的客户。一封 BFCM 专属邮件 + 销售电话，是这次成本最低、回报最高的一块。',5,1,'#16a34a'],
['04','分期付款放大','高客单 Hydra 用 Clicklease 分期，广告写"低至 $X/月"。$8,000 的机器变成每月一笔小钱，决策门槛大幅下降。',4,1,'#2563eb'],
['05','黑五直播','黑五当天 YouTube / Facebook 直播：现场对比雕刻速度和质量（沿用"真实 RF 挑战"），直播间下单送材料包（赠品，不是折扣）。',4,3,'#7c3aed'],
['06','"买机器，做圣诞生意"','12 月主题：现在买，马上能做圣诞礼品卖钱。用客户案例算一笔回本账，把第二个月的营收接上。',4,2,'#be185d'],
['07','年底抵税（Section 179）','美国企业在 12/31 前购入并投入使用的设备，通常可以当年抵扣。面向小企业客户打"年底前买、今年抵税"（注明请咨询税务顾问）。',4,1,'#0369a1'],
['08','UGC 作品大赛','活动期间客户晒 OneLaser 作品，评选送材料或配件。一次活动换来大量真实视频素材，补上官网和广告的内容缺口。',3,2,'#f59e0b'],
['09','以旧换新','老机器（任何品牌）换购 OneLaser 抵一部分钱，面向已经在做激光的用户。门槛高的用户最容易被这一招打动。',3,3,'#0f766e'],

ideas:[['01','Early Access list','Open a Black Friday early-access list 11/6–9; signups get SUPER Deals 24 hours early. Builds a pool of high-intent buyers before launch and lifts the 0.7% signup rate.',5,2,'#ff5a1f'],
['02','Real stock bars + live "sold"','Show "X sold / Y left" per model; Hydra 07 Pro shows "N of the first 14 left". The numbers are real, so the urgency is real — more convincing than a fake countdown, and no compliance risk.',5,2,'#dc2626'],
['03','Revive old leads','Pipedrive holds many unfollowed leads and unclosed quotes. One BFCM email + a sales call is the cheapest, highest-return play this time.',5,1,'#16a34a'],

['05','Black Friday livestream','Go live on YouTube / Facebook on Black Friday: side-by-side speed and quality tests (reuse the Real-World RF Challenge), with a free material pack for live orders (a gift, not a discount).',4,3,'#7c3aed'],

['07','Year-end tax angle (Section 179)','US businesses can usually deduct equipment bought and placed in service by 12/31. Pitch small-business buyers "buy before year end, deduct this year" (consult a tax advisor).',4,1,'#0369a1'],

let L='zh';try{L=localStorage.getItem('bfm-lang')||'zh'}catch(e){}

const dots=(n,c)=>`<span class="dots">${[1,2,3,4,5].map(i=>`<i class="${i<=n?'on':''}" style="--c:${c}"></i>`).join('')}</span>`;

 const t=T[L];document.documentElement.lang=L==='zh'?'zh':'en';

 verdict.innerHTML=`<div class="vc" style="--c:#16a34a"><h3>${t.good}</h3>${t.g.map(x=>`<div class="it"><div class="ic">✓</div><div><b>${x[0]}</b><span>${x[1]}</span></div></div>`).join('')}</div><div class="vc" style="--c:#dc2626"><h3>${t.risk}</h3>${t.r.map((x,i)=>`<div class="it"><div class="ic">${i+1}</div><div><b>${x[0]}</b><span>${x[1]}</span></div></div>`).join('')}</div>`;
 const D=56,x=d=>d<=24?d/24*70:70+(d-24)/(D-24)*29;
 const start=new Date('2026-11-06T00:00:00-08:00'),td=(now-start)/864e5;
 tlg.innerHTML=`<div class="tlax"></div>`+t.ph.map(p=>`<div class="ph" style="left:${x(p[1])}%;width:calc(${x(p[2])-x(p[1])}% - 3px);background:${p[3]}">${p[0]}</div>`).join('')+t.ms.map(m=>{const c=m[0]>=20&&m[0]<=24?'#dc2626':m[0]===4?'#ff5a1f':'#475569';return `<div class="ms" style="left:${x(m[0])}%;--c:${c}"><div class="pin"></div><div class="lb ${m[3]?'up':'dn'}"><div class="d">${m[1]}</div><div class="n">${m[2]}</div></div></div>`}).join('')+(td>=0&&td<=D?`<div class="today" style="left:${x(td)}%"><span>${t.today}</span></div>`:'');
 prep.innerHTML=t.prep.map(s=>`<span>${s}</span>`).join('');
 ws.innerHTML=t.ws.map(w=>`<div class="w" style="--c:${w[2]};--c2:${w[3]}"><div class="hd"><div class="t">${w[0]}${w[4].length?'':`<span class="new">${L==='zh'?'新增':'New'}</span>`}</div><div class="o">${t.owner}：${w[1]}</div></div><ul>${w[4].map(s=>`<li>${s}</li>`).join('')}${w[5].map(s=>`<li class="add">${s}</li>`).join('')}</ul><div class="ft"><span>${t.due} <b>${w[6]}</b></span><span>${t.kpi} <b>${w[7]}</b></span></div></div>`).join('');
 const pc=['#ff5a1f','#9333ea','#0f766e','#ca8a04','#2563eb','#0b1026','#db2777'];
 dtbl.innerHTML='<thead><tr>'+t.dth.map(h=>`<th>${h}</th>`).join('')+'</tr></thead><tbody>'+t.d.map((r,i)=>`<tr><td><b style="color:${pc[i]}">${r[0]}</b></td><td>${r[1]}</td><td>${(i===6?t.sizes.slice(5):t.sizes.slice(0,5)).map(s=>`<span class="pill" style="--b:#eef2ff;--f:#3730a3">${s}</span>`).join('')}</td><td><span class="pill" style="--b:#fff6e5;--f:#b45309">${t.st}</span></td></tr>`).join('')+'</tbody>';
 page.innerHTML=t.pg.map((b,i)=>`<div class="blk" style="--c:${b[2]}"><b>${i+1}. ${b[0]}</b><span>${b[1]}</span></div>`).join('');
 const done=QA.filter(Boolean).length;
