 const t=T[L];document.documentElement.lang=L==='zh'?'zh':'en';
 document.querySelectorAll('[data-t]').forEach(el=>el.innerHTML=t[el.dataset.t]);
 bz.className=L==='zh'?'on':'';be.className=L==='en'?'on':'';
 const nm=r=>L==='zh'?r.zh:r.en;
 const x={cu:sum(CL,r=>r.stock),nu:sum(IN.filter(r=>!r.clear),r=>r.stock)};
 const kv=[IN.length,sum(IN,r=>r.stock),x.cu,sum(IN,r=>r.us),'$'+(sum(IN,rev)/1e6).toFixed(2)+'M'],kc=['#1b2a6b','#2563eb','#dc2626','#d97706','#16a34a'];
 kpis.innerHTML=kv.map((v,i)=>`<div class="kpi" style="--c:${kc[i]}"><div class="v">${v}<small style="font-size:13px;font-weight:600"> ${t.ku[i]}</small></div><div class="l">${t.k[i]}</div></div>`).join('');
 const pg=['linear-gradient(135deg,#dc2626,#ff7a3d)','linear-gradient(135deg,#2563eb,#06b6d4)','linear-gradient(135deg,#334155,#64748b)'];
 pillars.innerHTML=t.pil.map((p,i)=>`<div class="pl" style="--g:${pg[i]}"><div class="no">${p[0]}</div><h3>${p[1]}</h3><p>${p[2]}</p><div class="big">${p[3](x)}</div></div>`).join('');
 ladder.innerHTML=t.lad.map(l=>{const c=BC[l[0]];const items=R.filter(r=>l[0]==='x'?r.tier==='no':(r.tier!=='no'&&band(r.npcr)===l[0]));const extra=l[0]==='x'?[]:R.filter(r=>r.bf2&&band(r.npcr2)===l[0]);return `<div class="rung" style="--c:${c[0]};--cb:${c[1]}"><div class="lv"><b>${l[1]}</b><span>${l[2]}</span></div><div class="it"><div class="use">${l[3]}</div>${items.length+extra.length?items.map(r=>`<span class="sku">${nm(r)}${r.bf2?(L==='zh'?' 前14台':' first 14'):''}<i>${r.npcr.toFixed(1)}%</i></span>`).join('')+extra.map(r=>`<span class="sku">${nm(r)}${L==='zh'?' 第15台起':' unit 15+'}<i>${r.npcr2.toFixed(1)}%</i></span>`).join(''):`<span class="empty">${t.none}</span>`}</div></div>`}).join('');
 pri.innerHTML=PRI.map((p,i)=>{const rs=p.skus.map(by),st=sum(rs,r=>r.stock),us=sum(rs,r=>r.us),tr=sum(rs,r=>r.tr),cn=sum(rs,r=>r.cn),rv=sum(rs,rev);const one=rs.length===1?rs[0]:null;
  const ch=k=>`<span class="chip" style="--b:${k==='ship'?'var(--goodbg)':k==='air'?'#f3e8ff':k==='base'?'#e0f2fe':'#fef3c7'};--f:${k==='ship'?'var(--good)':k==='air'?'#7c3aed':k==='base'?'#0369a1':'#b45309'}">${t.inc[k]}</span>`;
  const price=i===1?`<div class="opts"><div class="op hot"><span class="ol">${t.st1}</span><span class="now">$${fmt(one.bf)}</span><div class="chips"><span class="chip" style="--b:var(--badbg);--f:var(--bad)">${t.save} $${fmt(one.msrp-one.bf)}</span><span class="chip" style="--b:#eef0f4;--f:var(--ink2)">+$${one.ship}</span></div></div><div class="op"><span class="ol">${t.st2}</span><span class="now">$${fmt(one.bf2)}</span><div class="chips"><span class="chip" style="--b:var(--badbg);--f:var(--bad)">${t.save} $${fmt(one.msrp-one.bf2)}</span><span class="chip" style="--b:#eef0f4;--f:var(--ink2)">+$${one.ship}</span></div></div></div><div class="px"><span class="was">MSRP $${fmt(one.msrp)}</span></div>`:i===0?`<div class="opts"><div class="op"><span class="ol">${t.bA}</span><span class="now">$4,499</span><div class="chips">${ch('ship')}${ch('air')}</div></div><div class="op hot"><span class="ol">${t.bB}</span><span class="now">$4,999</span><div class="chips">${ch('ship')}${ch('air')}${ch('base')}${ch('mat')}</div></div></div><div class="px"><span class="was">MSRP $${fmt(one.msrp)}</span></div>`:one?`<div class="px"><span class="now">$${fmt(one.bf)}</span><span class="was">$${fmt(one.msrp)}</span><span class="chip" style="--b:var(--badbg);--f:var(--bad)">${t.save} $${fmt(one.msrp-one.bf)}</span>${one.ship===0?`<span class="chip" style="--b:var(--goodbg);--f:var(--good)">${t.free}</span>`:`<span class="chip" style="--b:#eef0f4;--f:var(--ink2)">+$${one.ship}</span>`}</div>`:`<div class="px">${rs.map(r=>`<span class="chip" style="--b:#eef2ff;--f:#3730a3">${nm(r)} · $${fmt(r.bf)} · ${r.stock}</span>`).join('')}</div>`;
  return `<div class="pc" style="--g:${p.g};--g2:${p.g2}"><div class="rk"><b>P${i+1}</b><span>${st} ${t.units}</span></div><div class="md"><h3>${t.pn[i]}</h3>${price}<div class="say">${t.ps[i]}</div></div><div class="rt"><div class="goal"><b>${st}</b>${t.units} · ${t.goal}</div><div class="goal">${t.rev} $${fmt(rv)}</div><div class="loc"><i style="width:${us/st*100}%;background:#16a34a"></i><i style="width:${tr/st*100}%;background:#f5b301"></i><i style="width:${cn/st*100}%;background:#94a3b8"></i></div><div class="lk"><span style="--c:#16a34a">${t.loc[0]} ${us}</span><span style="--c:#f5b301">${t.loc[1]} ${tr}</span><span style="--c:#94a3b8">${t.loc[2]} ${cn}</span></div></div></div>`}).join('');
 const order=[...R].sort((a,b)=>(a.tier==='no')-(b.tier==='no')||(b.clear-a.clear)||b.stock-a.stock);
 tbl.innerHTML='<thead><tr>'+t.th.map(h=>`<th>${h}</th>`).join('')+'</tr></thead><tbody>'+order.map(r=>{const c=BC[r.tier==='no'?'x':band(r.npcr)];const sd=r.ship-r.ssite;return `<tr class="${r.tier==='no'?'no':''}"><td><b>${nm(r)}</b>${r.clear?`<span class="clr">${t.clr}</span>`:''}${r.newm?`<span class="clr" style="background:#16a34a">${L==='zh'?'新品':'New'}</span>`:''}<span class="mini">${r.sku}${r.gift==='air'?' · '+t.inc.air:''}${r.gift==='bundle'?' · '+t.inc.air+' + '+t.inc.base+' + '+t.inc.mat:''}</span></td><td><span class="badge b-${r.tier}">${t.tier[r.tier]}</span></td><td style="color:#9aa3b2;text-decoration:line-through">$${fmt(r.msrp)}</td><td>$${fmt(r.site)}</td><td><b style="font-size:15px">$${fmt(r.bf)}</b></td><td style="color:var(--bad);font-weight:700">${r.msrp>r.bf?'$'+fmt(r.msrp-r.bf)+(r.gift?' '+t.bgift:''):'—'}</td><td>${r.ship===0?`<span class="free">${t.free}</span>`:'$'+r.ship}${r.tier!=='no'&&r.ship>0&&sd<0?`<span class="mini" style="color:var(--good)">−$${-sd}</span>`:''}</td><td><b>$${fmt(r.total)}</b></td><td>${r.stock} / <b style="color:${r.us?'var(--good)':'var(--bad)'}">${r.us}</b></td><td><span class="np" style="--c:${c[0]};--cb:${c[1]}">${r.npcr.toFixed(1)}%</span>${r.gift?`<span class="mini">${t.gnote}${r.raw?` · ${t.raw} ${r.raw}%`:''}${r.gift==='bundle'?(L==='zh'?' · 未含材料':' · excl. materials'):''}</span>`:''}</td></tr>`+(r.bf2?`<tr class="bund"><td><b>↳ ${nm(r)} · ${t.st2}</b><span class="mini">${L==='zh'?'卖满 14 台后改价':'after 14 units sell'}</span></td><td><span class="badge b-super">Super Price</span></td><td style="color:#9aa3b2;text-decoration:line-through">$${fmt(r.msrp)}</td><td>$${fmt(r.site)}</td><td><b style="font-size:15px">$${fmt(r.bf2)}</b></td><td style="color:var(--bad);font-weight:700">$${fmt(r.msrp-r.bf2)}</td><td>$${r.ship}</td><td><b>$${fmt(r.total2)}</b></td><td>${r.stock-r.s1n}</td><td><span class="np" style="--c:${BC[band(r.npcr2)][0]};--cb:${BC[band(r.npcr2)][1]}">${r.npcr2.toFixed(1)}%</span></td></tr>`:'')+(r.sku==='ODL-XRF-38-US01'?`<tr class="bund"><td><b>↳ ${nm(r)} · ${t.bB}</b><span class="mini">${t.inc.air} + ${t.inc.base} + ${t.inc.mat}</span></td><td><span class="badge b-super">Super Price</span></td><td style="color:#9aa3b2;text-decoration:line-through">$${fmt(r.msrp)}</td><td>$${fmt(r.site)}</td><td><b style="font-size:15px">$4,999</b></td><td style="color:var(--bad);font-weight:700">$${fmt(r.msrp-4999)} ${t.bgift}</td><td><span class="free">${t.free}</span></td><td><b>$4,999</b></td><td>${L==='zh'?'共用 120':'shares 120'}</td><td><span class="np" style="--c:#ea580c;--cb:#fff0e6">${r.npcrB.toFixed(1)}%</span><span class="mini">${t.gnote}${L==='zh'?' · 未含材料':' · excl. materials'}</span></td></tr>`:'')}).join('')+'</tbody>';
 {const a=by('ODL-XRF-38-US01');const ch2=k=>`<span class="chip" style="--b:${k==='ship'?'var(--goodbg)':k==='air'?'#f3e8ff':k==='base'?'#e0f2fe':'#fef3c7'};--f:${k==='ship'?'var(--good)':k==='air'?'#7c3aed':k==='base'?'#0369a1':'#b45309'}">${t.inc[k]}</span>`;const card=(c,hd,pr,np,ks)=>`<div class="nbk" style="--bc:${c}"><div class="hd">${hd}</div><div class="nm">${nm(a)}</div><span class="now">$${fmt(pr)}</span><span class="was">$${fmt(a.msrp)}</span><div class="chips">${ks.map(ch2).join('')}</div><div style="font-size:12.5px;color:var(--ink2);margin-top:8px">NPCR ${np.toFixed(1)}% · ${t.th[8]}: ${a.stock} / ${a.us}</div></div>`;nbx.innerHTML=`<div class="nbc">${card('#64748b',t.bA,4499,a.npcr,['ship','air'])}${card('#ff5a1f',t.bB,4999,a.npcrB,['ship','air','base','mat'])}</div><div class="warnbox" style="background:#e8f7ee;border-color:#86efac;color:#14532d">${t.nbm}</div>`;}
